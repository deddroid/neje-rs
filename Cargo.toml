[package]
name = "neje"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Free software for the NEJE DK-8-KZ laser engraver (protocols V10/V20/V21/V30): image preparation, G-code, serial control, CLI and GUI"
readme = "README.md"
default-run = "neje"

[lib]
name = "neje"
path = "src/lib.rs"

[[bin]]
name = "neje"
path = "src/main.rs"

[[bin]]
name = "neje-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:dirs", "dep:serde", "dep:toml"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
regex = "1.13.1"
# Without libudev: on Linux the ports are listed from /sys/class/tty (no build dependency).
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"

dirs = { version = "7.0.0", optional = true }
eframe = { version = "0.37.0", optional = true }
rfd = { version = "0.18.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
toml = { version = "1.2.1", optional = true }
ctrlc = "3.5.2"

[dev-dependencies]
sha2 = "0.11.1"

[profile.release]
lto = true
strip = true

# Image processing loops are slow without optimisation; keep tests fast.
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 2
